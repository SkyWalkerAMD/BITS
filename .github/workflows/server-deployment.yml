name: Original-protocol server deployment matrix

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        default: full
  push:
    branches: [codex/server-multidistro]
  workflow_dispatch:
    inputs:
      matrix:
        description: 'quick: four representative OS versions; full: all twelve OS images'
        type: choice
        options: [quick, full, debian11]
        default: quick

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select explicitly requested OS matrix
        id: matrix
        env:
          MATRIX_MODE: ${{ inputs.matrix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from bits_core.center.platforms import MATRIX
          mode = os.environ['MATRIX_MODE'] or 'quick'
          selected = [dict(label=label, image=image) for label, image in MATRIX if mode == 'full' or (mode == 'debian11' and label == 'debian11') or (mode == 'quick' and label in ('rocky8','rocky10','ubuntu22','debian13'))]
          print('value=' + json.dumps({'include': selected}))
          PY
      - name: Validate pure input rules and build the release in Linux
        run: |
          python3 -m unittest bits_core.center.test_server -v
          bash -n bits_core/center/install.sh
          bash -n bits_core/center/dependencies.sh
          bash -n bits_core/center/guard.sh
          bash -n ci/server_image.sh
          python3 -m bits_core.center.build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-package-${{ github.run_id }}
          path: server-dist/
          retention-days: 14

  services:
    needs: package
    name: ${{ matrix.label }} / real systemd services
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.package.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-package-${{ github.run_id }}
          path: server-dist
      - name: Install native packages in the target OS
        env:
          BASE_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p .server-results
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" --format '{{json .RepoDigests}}' > .server-results/base-image.txt
          base_digest=$(docker image inspect "$BASE_IMAGE" --format '{{index .RepoDigests 0}}')
          if test "$BASE_IMAGE" = debian:11; then
            for scheme in http https; do
              url="$scheme://security.debian.org/debian-security/pool/updates/main/s/systemd/systemd_247.3-7+deb11u8_amd64.deb"
              printf '%s\n' "$url"
              curl -sSI --max-time 20 "$url" || true
            done | tee .server-results/repository-probe.txt
          fi
          set -o pipefail
          if test "$BASE_IMAGE" = debian:11; then
            python3 bits_core/workloads/debian11_ci.py server ocrun-server-test 2>&1 | tee .server-results/packages.txt
          else
            docker build --progress plain --build-arg BASE_IMAGE="$base_digest" -f ci/server.Dockerfile -t ocrun-server-test . 2>&1 | tee .server-results/packages.txt
          fi
          docker image inspect ocrun-server-test --format '{{.Id}}' > .server-results/image.txt
      - name: Boot the target system manager
        run: |
          docker run -d --name ocrun-server-test -e container=docker --privileged --cgroupns=private \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$GITHUB_WORKSPACE/.server-results:/results" \
            ocrun-server-test /bin/bash -c 'mount -o remount,rw /sys/fs/cgroup; exec /sbin/init'
          for attempt in $(seq 1 60); do
            if docker exec ocrun-server-test test -d /run/systemd/system; then break; fi
            sleep 1
          done
          docker exec ocrun-server-test test -d /run/systemd/system
          docker exec ocrun-server-test tar -xzf /src/server-dist/bits-center-runtime-0.3.0.tar.gz -C /root
      - name: Verify installation, original protocol, persistence, transfer and rollback
        run: |
          set -o pipefail
          address=$(docker inspect ocrun-server-test --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          docker exec -w /src ocrun-server-test python3 -B -m unittest bits_core.center.test_server -v 2>&1 | tee .server-results/unit.txt
          docker exec -e GITHUB_ACTIONS=true ocrun-server-test python3 -I -B /src/ci/server_deploy_test.py "$address" 2>&1 | tee .server-results/services.txt
          if curl --noproxy '*' -fsS --max-time 3 "http://$address/config/ocrun-version.txt" >/dev/null; then
            echo 'Host outside configured /32 network unexpectedly reached the resource service' >&2
            exit 1
          fi
          printf 'outside-management-network request was denied\n' > .server-results/network.txt
      - name: Collect actual service evidence
        if: always()
        run: |
          docker logs ocrun-server-test > .server-results/boot.txt 2>&1 || true
          docker exec ocrun-server-test journalctl --no-pager -u bits-center-db -u bits-center-http -u bits-center-rsync -u bits-center-firewall > .server-results/journal.txt 2>&1 || true
          docker exec ocrun-server-test systemctl --no-pager --failed > .server-results/failed-units.txt 2>&1 || true
          if test -f .server-results/server.json; then cat .server-results/server.json >> "$GITHUB_STEP_SUMMARY"; fi
          docker rm -f ocrun-server-test || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: server-${{ matrix.label }}-${{ github.run_id }}
          path: .server-results/
          include-hidden-files: true
          retention-days: 14
