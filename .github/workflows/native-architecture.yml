name: Independent BITS architecture
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        type: boolean
        default: false
  push:
    branches: [codex/bits-independent-architecture]
    paths: ['native/**', '.github/workflows/native-architecture.yml', 'bits_core/workloads/suite.py']
permissions:
  contents: read
concurrency:
  group: native-architecture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.27.1', cache: false}
      - name: Verify locked dependencies and format review copy
        working-directory: native
        run: |
          go mod download
          go mod verify
          gofmt -w .
          git diff -- . > /tmp/native-format.patch
      - name: Format browser sources for review
        run: |
          npm exec --yes --package=prettier@3.6.2 -- prettier --write native/web/app.js native/web/dispatch.js native/web/operations.js native/web/hardware-info.js native/web/style.css native/web/index.html
          git diff -- native/ > /tmp/native-format.patch
      - name: Check the explicit public source export
        run: |
          python3 ci/repository_layout.py
          cp .layout-results/layout.json /tmp/native-layout.json
          python3 -m unittest distribution.test_source_export
          python3 - <<'PY'
          import os
          from distribution.source_export import export_sources
          print(export_sources('/tmp/bits-reviewed-source.tar.gz', os.environ['GITHUB_SHA']))
          PY
      - name: Race, recovery, live fleet, authentication and 200-node transaction tests
        working-directory: native
        run: |
          set -o pipefail
          go test -mod=readonly -race -count=1 -v ./... | tee /tmp/native-tests.txt
          go vet -mod=readonly ./...
          mkdir -p /tmp/native-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -mod=readonly -trimpath -o /tmp/native-bin/bits-center ./cmd/bits-center
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -mod=readonly -trimpath -o /tmp/native-bin/bits-node ./cmd/bits-node
          python3 "$GITHUB_WORKSPACE/native/ci/licenses.py" /tmp/native-bin/licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: 'independent-binaries-${{ github.run_id }}', path: /tmp/native-bin/, retention-days: 14}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-core-${{ github.run_id }}
          path: |
            /tmp/native-format.patch
            /tmp/native-tests.txt
            /tmp/native-layout.json
            native/go.mod
            native/go.sum
          retention-days: 14
  packages:
    needs: protocol
    runs-on: ubuntu-22.04
    strategy:
      matrix: {kind: [rpm, deb]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'independent-binaries-${{ github.run_id }}', path: native-bin}
      - name: Build only reviewed native payloads with pinned workload binaries
        env: {GH_TOKEN: '${{ github.token }}', KIND: '${{ matrix.kind }}'}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          mkdir baseline
          gh release download v0.3.0 --repo SkyWalkerAMD/BITS --pattern "bits-node*.$KIND" --dir baseline
          python3 native/package.py --kind "$KIND" --binaries native-bin --baseline "$(find baseline -name "*.$KIND" -type f)" --output native-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: 'independent-packages-${{ matrix.kind }}-${{ github.run_id }}', path: native-dist/, retention-days: 30}
  linux:
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.full_matrix && '[{"label":"rocky8","image":"rockylinux/rockylinux:8","kind":"rpm"},{"label":"rocky9","image":"rockylinux/rockylinux:9","kind":"rpm"},{"label":"rocky10","image":"rockylinux/rockylinux:10","kind":"rpm"},{"label":"alma8","image":"almalinux:8","kind":"rpm"},{"label":"alma9","image":"almalinux:9","kind":"rpm"},{"label":"alma10","image":"almalinux:10","kind":"rpm"},{"label":"debian11","image":"debian:11","kind":"deb"},{"label":"debian12","image":"debian:12","kind":"deb"},{"label":"debian13","image":"debian:13","kind":"deb"},{"label":"ubuntu22","image":"ubuntu:22.04","kind":"deb"},{"label":"ubuntu24","image":"ubuntu:24.04","kind":"deb"},{"label":"ubuntu26","image":"ubuntu:26.04","kind":"deb"}]' || '[{"label":"rocky8","image":"rockylinux/rockylinux:8","kind":"rpm"},{"label":"ubuntu22","image":"ubuntu:22.04","kind":"deb"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'independent-packages-${{ matrix.kind }}-${{ github.run_id }}', path: native-dist}
      - name: Real Linux installation, services, tool lifecycle and protected data boundary
        env: {BASE_IMAGE: '${{ matrix.image }}'}
        run: bash native/ci/cloud.sh
      - name: Browser interaction and desktop/mobile evidence
        if: matrix.label == 'ubuntu22'
        run: |
          python3 -m pip install playwright==1.55.0
          sudo apt-get install -y fonts-noto-cjk
          python3 -m playwright install --with-deps chromium
          python3 native/ci/browser.py
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p .independent-results
          docker logs bits-independent-test > .independent-results/boot.txt 2>&1 || true
          docker rm -f bits-independent-test || true
          sudo chown -R "$(id -u):$(id -g)" .independent-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: 'independent-test-${{ matrix.label }}-${{ github.run_id }}', path: .independent-results/, include-hidden-files: true, retention-days: 30}
  upgrade:
    if: inputs.full_matrix
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: rocky8, image: 'rockylinux/rockylinux:8', kind: rpm}
          - {label: ubuntu22, image: 'ubuntu:22.04', kind: deb}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'independent-packages-${{ matrix.kind }}-${{ github.run_id }}', path: native-dist}
      - name: Download immutable 0.4.0 packages and check pinned hashes
        env: {GH_TOKEN: '${{ github.token }}', KIND: '${{ matrix.kind }}'}
        run: |
          mkdir upgrade-from
          gh release download v0.4.0 --repo SkyWalkerAMD/BITS --pattern "bits-*.$KIND" --dir upgrade-from
          cd upgrade-from
          sha256sum --check --ignore-missing <<'HASHES'
          1ea079307c7c0daedadf504a4ac572104b86a21ed1ba00916d91fada794519aa  bits-center-0.4.0-1.el8.x86_64.rpm
          771b8b6909e7f61cd898706ddd35482b21ce5bbaf49ed587b642decedddd10f2  bits-node-0.4.0-1.el8.x86_64.rpm
          5bd7a7b57cc2f78868d3a99341146b23d822b3a94936e6fc68b7dd509eb52248  bits-center_0.4.0-1_amd64.deb
          96569084b0b8e2304d763915d8061fcde91bc46871ecb0ede5c09778ef265bf0  bits-node_0.4.0-1_amd64.deb
          HASHES
      - name: Upgrade real packages while preserving identity, templates and sealed reports
        env: {BASE_IMAGE: '${{ matrix.image }}', KIND: '${{ matrix.kind }}'}
        run: bash native/ci/upgrade.sh
      - name: Capture upgrade diagnostics
        if: always()
        run: |
          mkdir -p .independent-upgrade-results
          docker logs bits-independent-upgrade > .independent-upgrade-results/boot.txt 2>&1 || true
          docker rm -f bits-independent-upgrade || true
          sudo chown -R "$(id -u):$(id -g)" .independent-upgrade-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: 'independent-upgrade-${{ matrix.label }}-${{ github.run_id }}', path: .independent-upgrade-results/, include-hidden-files: true, retention-days: 30}
  release:
    if: inputs.full_matrix
    needs: [protocol, packages, linux, upgrade]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'independent-packages-*-${{ github.run_id }}', path: native-evidence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'independent-test-*-${{ github.run_id }}', path: native-evidence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'independent-upgrade-*-${{ github.run_id }}', path: native-evidence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'native-core-${{ github.run_id }}', path: native-evidence/core}
      - name: Assemble reviewed source and same-run packages with evidence
        run: python3 native/ci/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: 'bits-independent-release-${{ github.run_id }}', path: native-release/, retention-days: 30}
